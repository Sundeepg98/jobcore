name: tests

# jobcore is the one repo every other repo's behaviour now depends on, and it
# was the one with no automated gate. "Green on this laptop, when someone
# remembers" is not a gate. The suite has zero dependencies and runs in under
# a second, so there is no excuse for it not to run on every push.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the operator's box and the platform the PID-liveness lock
        # and the mtime-collision finding are specific to. Linux keeps the
        # library honest about path handling.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (test extra only — the package itself has no dependencies)
        run: python -m pip install -e ".[test]"
      - name: Run the suite
        # No ambient config anywhere on a runner, but be explicit: a suite that
        # silently picks up a file is a suite that measures the machine.
        env:
          JOBHUNT_CONFIG: ":none:"
        run: python -m pytest -q
